services:
  postgres:
    image: postgres:16-alpine
    container_name: visone-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: visone
      POSTGRES_PASSWORD: visone_dev_password
      POSTGRES_DB: visone
    volumes:
      - visone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visone -d visone"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: visone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - visone_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: visone-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: visone_minio
      MINIO_ROOT_PASSWORD: visone_minio_secret
    command: server /data --console-address ":9001"
    volumes:
      - visone_minio:/data

  minio-init:
    image: minio/mc:latest
    container_name: visone-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set local http://minio:9000 visone_minio visone_minio_secret;
      /usr/bin/mc mb -p local/visone-assets;
      /usr/bin/mc anonymous set download local/visone-assets/public;
      exit 0;
      "

volumes:
  visone_pgdata:
  visone_redis:
  visone_minio:
